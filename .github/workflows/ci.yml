name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 本仓没有单元测试：verification/verify-ui.mjs 需要真实浏览器和运行中的 DSH 实例，
      # 属于本地验收，不进 CI。这里只保证所有 JS 文件语法可解析。
      - name: 语法检查（node --check）
        run: npm run check
